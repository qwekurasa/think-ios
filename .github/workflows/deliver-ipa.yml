name: Retrieve CC0 Pocket Journal
on:
  push:
    branches: [amber-ipa-download]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - name: Download CC0 geometry
        run: |
          curl --fail --location --max-time 25 "https://files.innerscene.com/library/pocket-journal-stationery-b8ef081a/1575da90d03f6eb0f257/closed-journal.glb" -o journal.glb
          sha256sum journal.glb
          base64 -w 2048 journal.glb | sed 's/^/MODEL_DATA /'
