name: Think Amber IPA
on:
  push:
    branches: [amber-iphone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check corrections and pauses in dictated phrases
        run: |
          printf 'import Foundation\n' > "$RUNNER_TEMP/dictation.swift"
          sed -n '/^struct SpeechPhrases {/,/^}/p' Think/ThinkApp.swift >> "$RUNNER_TEMP/dictation.swift"
          cat >> "$RUNNER_TEMP/dictation.swift" <<'SWIFT'
          var p = SpeechPhrases()
          precondition(p.receive("Поймать",start:0,end:0.4,at:0) == "Поймать")
          precondition(p.receive("Поймать мысль",start:0,end:0.9,at:0.4) == "Поймать мысль")
          precondition(p.receive("и записать",start:2,end:3,at:3) == "Поймать мысль и записать")
          precondition(p.receive("и записать её",start:2,end:3.5,at:3.3) == "Поймать мысль и записать её")
          precondition(p.receive("Проверить",start:0,end:0.5,at:6) == "Поймать мысль и записать её Проверить")
          precondition(p.receive("Проверить.",start:0,end:0.5,at:8,closing:true) == "Поймать мысль и записать её Проверить.")
          var stop = SpeechPhrases()
          precondition(stop.receive("В 1842-м году",start:0,end:1.2,at:1) == "В 1842-м году")
          precondition(stop.receive("году",start:1,end:1.2,at:3,closing:true) == "В 1842-м году")
          var repeatWords = SpeechPhrases()
          _ = repeatWords.receive("Привет",start:0,end:0.4,at:0.5)
          precondition(repeatWords.receive("Привет привет",start:0,end:1.1,at:1.1) == "Привет привет")
          var replay = SpeechPhrases()
          _ = replay.receive("первая часть",start:0,end:0.9,at:1)
          _ = replay.receive("вторая часть",start:2,end:2.9,at:3)
          precondition(replay.receive("первая часть вторая часть",start:0,end:2.9,at:4,closing:true) == "первая часть вторая часть")
          var rollback = SpeechPhrases()
          _ = rollback.receive("Идея для приложения",start:0,end:1,at:1)
          _ = rollback.receive("Идея для приложения с голосовым вводом",start:0,end:4,at:4)
          precondition(rollback.receive("Идея для приложения",start:0,end:1,at:4.1) == "Идея для приложения с голосовым вводом")
          precondition(rollback.receive("голосовым вводом",start:3,end:4,at:5,closing:true) == "Идея для приложения с голосовым вводом")
          var paused = SpeechPhrases()
          _ = paused.receive("Первый отрезок",start:0,end:1,at:1)
          _ = paused.receive("новая фраза после паузы",start:2,end:4,at:4)
          precondition(paused.receive("Первый отрезок новая фраза",start:0,end:3,at:4.2) == "Первый отрезок новая фраза после паузы")
          precondition(paused.receive("Первый отрезок новая фраза после паузы.",start:0,end:4,at:4.4,closing:true) == "Первый отрезок новая фраза после паузы.")
          var intentionalRepeat = SpeechPhrases()
          _ = intentionalRepeat.receive("Да",start:0,end:0.4,at:0.4)
          precondition(intentionalRepeat.receive("да",start:2,end:2.4,at:2.4) == "Да да")
          SWIFT
          swift "$RUNNER_TEMP/dictation.swift"
      - name: Check retention, pin spending and completion rewards
        run: |
          cat > "$RUNNER_TEMP/ideas.swift" <<'SWIFT'
          import Foundation
          enum Bloom: String, Codable { case daisy }
          SWIFT
          sed -n '/^struct Idea: Codable/,/^enum Page/{ /^enum Page/d; p; }' Think/ThinkApp.swift >> "$RUNNER_TEMP/ideas.swift"
          cat >> "$RUNNER_TEMP/ideas.swift" <<'SWIFT'
          let start = Date(timeIntervalSince1970: 1000000)
          let idea = Idea(id:UUID(),text:"A",step:"",created:start,award:1)
          let second = Idea(id:UUID(),text:"B",step:"",created:start,award:1)
          let third = Idea(id:UUID(),text:"C",step:"",created:start,award:1)
          let day = Notebook.day
          var book = Notebook(ideas:[idea,second,third],balance:12)
          book.resume(at:start)
          precondition(book.pin(idea.id,at:start) != nil && book.balance == 0)
          precondition(book.pin(idea.id,at:start) == nil)
          precondition(book.complete(second.id,at:start) != nil && book.balance == 5)
          precondition(book.complete(second.id,at:start) == nil)
          book.resume(at:start+7*day)
          precondition(book.ideas.map(\.section) == [.active,.completed,.archived])
          book.resume(at:start+31*day)
          precondition(book.ideas[0].section == .archived && book.ideas[1].section == .completed)
          precondition(book.restore(third.id)?.section == .active)
          let old = try JSONDecoder().decode(Notebook.self,from:Data(#"{"ideas":[],"balance":42,"cool":true}"#.utf8))
          precondition(old.balance == 42 && old.lastSeen == nil)
          SWIFT
          swift "$RUNNER_TEMP/ideas.swift"
      - name: Build for iPhone
        run: |
          xcodebuild -project Think.xcodeproj -target Think -configuration Release -sdk iphoneos ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/iphone" build
      - name: Package and verify IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$RUNNER_TEMP/iphone/Think.app" "$RUNNER_TEMP/package/Payload/Think.app"
          cd "$RUNNER_TEMP/package"
          APP=Payload/Think.app
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleSupportedPlatforms:0' "$APP/Info.plist")" = iPhoneOS
          lipo "$APP/$EXEC" -verify_arch arm64
          zip -qry "$GITHUB_WORKSPACE/Think.ipa" Payload
          unzip -tq "$GITHUB_WORKSPACE/Think.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/Think.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Think-Amber-Sideloadly
          path: Think.ipa
          if-no-files-found: error
