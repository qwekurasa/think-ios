name: Think Amber IPA
on:
  push:
    branches: [amber-iphone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check corrections and pauses in dictated phrases
        run: |
          printf 'import Foundation\n' > "$RUNNER_TEMP/dictation.swift"
          sed -n '/^struct SpeechPhrases {/,/^}/p' Think/ThinkApp.swift >> "$RUNNER_TEMP/dictation.swift"
          cat >> "$RUNNER_TEMP/dictation.swift" <<'SWIFT'
          var p = SpeechPhrases()
          precondition(p.receive("Поймать",start:0,end:0.4,at:0) == "Поймать")
          precondition(p.receive("Поймать мысль",start:0,end:0.9,at:0.4) == "Поймать мысль")
          precondition(p.receive("и записать",start:2,end:3,at:3) == "Поймать мысль и записать")
          precondition(p.receive("и записать её",start:2,end:3.5,at:3.3) == "Поймать мысль и записать её")
          precondition(p.receive("Проверить",start:0,end:0.5,at:6) == "Поймать мысль и записать её Проверить")
          precondition(p.receive("Проверить.",start:0,end:0.5,at:8,closing:true) == "Поймать мысль и записать её Проверить.")
          var stop = SpeechPhrases()
          precondition(stop.receive("В 1842-м году",start:0,end:1.2,at:1) == "В 1842-м году")
          precondition(stop.receive("году",start:1,end:1.2,at:3,closing:true) == "В 1842-м году")
          var repeatWords = SpeechPhrases()
          _ = repeatWords.receive("Привет",start:0,end:0.4,at:0.5)
          precondition(repeatWords.receive("Привет привет",start:0,end:1.1,at:1.1) == "Привет привет")
          var replay = SpeechPhrases()
          _ = replay.receive("первая часть",start:0,end:0.9,at:1)
          _ = replay.receive("вторая часть",start:2,end:2.9,at:3)
          precondition(replay.receive("первая часть вторая часть",start:0,end:2.9,at:4,closing:true) == "первая часть вторая часть")
          SWIFT
          swift "$RUNNER_TEMP/dictation.swift"
      - name: Build for iPhone
        run: |
          xcodebuild -project Think.xcodeproj -target Think -configuration Release -sdk iphoneos ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/iphone" build
      - name: Package and verify IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$RUNNER_TEMP/iphone/Think.app" "$RUNNER_TEMP/package/Payload/Think.app"
          cd "$RUNNER_TEMP/package"
          APP=Payload/Think.app
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleSupportedPlatforms:0' "$APP/Info.plist")" = iPhoneOS
          lipo "$APP/$EXEC" -verify_arch arm64
          zip -qry "$GITHUB_WORKSPACE/Think.ipa" Payload
          unzip -tq "$GITHUB_WORKSPACE/Think.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/Think.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Think-Amber-Sideloadly
          path: Think.ipa
          if-no-files-found: error
