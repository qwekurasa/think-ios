name: Verify notebook at first launch
on:
  push:
    branches: [amber-iphone]
    paths: ['Think/Visuals.swift', '.github/workflows/orb-launch.yml']
permissions:
  contents: read
jobs:
  cold-launch:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Launch on a clean iPhone simulator and inspect the notebook
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for rt,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcodebuild -project Think.xcodeproj -target Think -configuration Release -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/sim" build
          xcrun simctl bootstatus "$DEVICE" -b
          python3 -m venv "$RUNNER_TEMP/img"
          "$RUNNER_TEMP/img/bin/pip" -q install pillow
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/sim/Think.app"
          xcrun simctl launch "$DEVICE" studio.think.ideas
          for i in 1 2 3 4 5 6; do
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/launch.png"
            if "$RUNNER_TEMP/img/bin/python" - <<'PY'
          from PIL import Image
          import os
          im=Image.open(os.environ['RUNNER_TEMP']+'/launch.png').convert('RGB')
          w,h=im.size
          # Check for the graphite cover and the black surrounding canvas.
          cover=im.crop((int(w*.40),int(h*.40),int(w*.60),int(h*.55)))
          surround=im.crop((0,int(h*.36),int(w*.13),int(h*.65)))
          count=sum(35 < r < 165 and abs(r-g)<16 and abs(r-b)<20 for r,g,b in cover.getdata())
          black=sum(max(p)<12 for p in surround.getdata())/ (surround.width*surround.height)
          print('Graphite cover pixels and black margin:',count,black)
          assert count > 1000 and black > .9
          PY
            then exit 0; fi
            sleep 1
          done
          exit 1
