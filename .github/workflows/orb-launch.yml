name: Verify the saved notebook at launch
on:
  push:
    branches: [amber-iphone]
    paths: ['Think/Visuals.swift', 'Think/Assets.xcassets/JournalMesh.dataset/**', '.github/workflows/orb-launch.yml']
permissions:
  contents: read
jobs:
  cold-launch:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Launch on a clean iPhone simulator and inspect the saved notebook
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for rt,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcodebuild -project Think.xcodeproj -target Think -configuration Release -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/sim" build
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun assetutil --info "$RUNNER_TEMP/sim/Think.app/Assets.car" | grep -F JournalMesh
          python3 -m venv "$RUNNER_TEMP/img"
          "$RUNNER_TEMP/img/bin/pip" -q install pillow
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/sim/Think.app"
          export APP_CONTAINER
          APP_CONTAINER=$(xcrun simctl get_app_container "$DEVICE" studio.think.ideas data)
          "$RUNNER_TEMP/img/bin/python" - <<'PY'
          import base64, io, json, os, pathlib, plistlib
          from PIL import Image
          cover = Image.new('RGB',(280,400),(225,32,28))
          cover.paste((28,190,52),(0,200,280,400))
          output = io.BytesIO()
          cover.save(output,format='JPEG')
          photo = base64.b64encode(output.getvalue()).decode('ascii')
          path = pathlib.Path(os.environ['APP_CONTAINER']) / 'Library/Preferences/studio.think.ideas.plist'
          path.parent.mkdir(parents=True,exist_ok=True)
          with path.open('wb') as file:
              plistlib.dump({'think.journal.v1': json.dumps({'title':'Launch fixture','shade':0,'photo':photo}).encode()},file)
          PY
          xcrun simctl launch "$DEVICE" studio.think.ideas
          for i in 1 2 3 4 5 6; do
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/launch.png"
            if "$RUNNER_TEMP/img/bin/python" - <<'PY'
          from PIL import Image
          import os
          im=Image.open(os.environ['RUNNER_TEMP']+'/launch.png').convert('RGB')
          w,h=im.size
          # The home logo and tab bar distinguish home from notebook setup.
          cover=im.crop((int(w*.34),int(h*.25),int(w*.66),int(h*.71)))
          surround=im.crop((0,int(h*.36),int(w*.13),int(h*.65)))
          pixels=list(cover.getdata())
          reds=[i//cover.width for i,(r,g,b) in enumerate(pixels) if r>g+30 and r>b+30]
          greens=[i//cover.width for i,(r,g,b) in enumerate(pixels) if g>r+30 and g>b+30]
          black=sum(max(p)<12 for p in surround.getdata())/ (surround.width*surround.height)
          header=im.crop((int(w*.28),int(h*.09),int(w*.72),int(h*.16)))
          tabs=im.crop((int(w*.06),int(h*.88),int(w*.94),int(h*.97)))
          blue_header=sum(b-r>24 and b-g>10 for r,g,b in header.getdata())
          blue_tabs=sum(b-r>24 and b-g>10 for r,g,b in tabs.getdata())
          from statistics import median
          print('Notebook photo color pixels and logo:',len(reds),len(greens),blue_header,blue_tabs)
          assert min(len(reds),len(greens)) > 1000 and median(reds)+25 < median(greens)
          assert black > .9 and blue_header > 100 and blue_tabs > 100
          PY
            then exit 0; fi
            sleep 1
          done
          exit 1
